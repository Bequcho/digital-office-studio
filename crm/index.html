<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>BEQSON CRM</title>
  <link rel="icon" href="/assets/favicon-v3.png?v=3" type="image/png">
  <link rel="stylesheet" href="/assets/crm.css?v=2">
</head>
<body>
  <div class="crm-bg"></div>
  <main class="crm-shell">
    <section id="auth-view" class="auth-card">
      <a href="/ru/" class="crm-brand"><img src="/assets/beqson-mark-v3.png" alt="" width="44" height="44"><span><b>BEQSON</b><small>CRM</small></span></a>
      <p class="eyebrow">PRIVATE WORKSPACE</p>
      <h1>Вход в BEQSON CRM</h1>
      <p class="muted">Доступ к заявкам защищён Supabase Auth и Row Level Security.</p>
      <form id="auth-form">
        <label>Email<input id="auth-email" type="email" value="digitalstudiobeqson@gmail.com" autocomplete="email" required></label>
        <label>Пароль<input id="auth-password" type="password" minlength="8" autocomplete="current-password" required></label>
        <div class="auth-actions">
          <button class="primary" type="submit">Войти</button>
          <button class="secondary" type="button" id="signup-btn">Создать доступ</button>
        </div>
        <p id="auth-status" class="status"></p>
      </form>
      <p class="auth-note">Первый раз: нажмите «Создать доступ», подтвердите письмо Supabase и затем войдите.</p>
    </section>

    <section id="app-view" class="app" hidden>
      <header class="topbar">
        <a href="/ru/" class="crm-brand"><img src="/assets/beqson-mark-v3.png" alt="" width="40" height="40"><span><b>BEQSON</b><small>LEAD CRM</small></span></a>
        <div class="top-actions"><a href="/crm/proposals/" class="ghost" style="text-decoration:none;display:inline-flex;align-items:center">Предложения</a><button id="refresh-btn" class="ghost">Обновить</button><button id="logout-btn" class="ghost">Выйти</button></div>
      </header>

      <section class="hero-row">
        <div><p class="eyebrow">BEQSON LEAD SYSTEM</p><h1>Заявки и проекты</h1><p class="muted">Все обращения с сайта в одном месте.</p></div>
        <div class="search-wrap"><input id="search" type="search" placeholder="Поиск по имени, контакту, нише…"></div>
      </section>

      <section class="stats" id="stats"></section>
      <section class="board" id="board"></section>
    </section>
  </main>

  <dialog id="lead-dialog" class="lead-dialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="Закрыть">×</button>
      <div id="lead-detail"></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/crm.js?v=2" defer></script>
</body>
</html>
