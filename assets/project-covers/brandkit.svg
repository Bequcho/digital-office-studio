<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title"><title id="title">Coordinated brand palette, presentation slide, social campaign and banner assets</title><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07182e"/><stop offset=".55" stop-color="#0b2440"/><stop offset="1" stop-color="#040d1d"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#077ac7" stop-opacity=".38"/><stop offset="1" stop-color="#0570aa" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2=".8" y2="1"><stop stop-color="#153651"/><stop offset="1" stop-color="#091a30"/></linearGradient>
<linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#a4fbff"/><stop offset=".35" stop-color="#39cdea"/><stop offset="1" stop-color="#1552ea"/></linearGradient>
<linearGradient id="metal" x2="0" y2="1"><stop stop-color="#a3d4e4"/><stop offset=".3" stop-color="#345c77"/><stop offset=".65" stop-color="#0c253d"/><stop offset="1" stop-color="#49788f"/></linearGradient>
