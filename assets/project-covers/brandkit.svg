<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><rect width="1600" height="1000" fill="url(#bg)"/><ellipse cx="1000" cy="410" rx="760" ry="620" fill="url(#halo)"/><path d="M0 850 Q800 730 1600 850" fill="none" stroke="#203d57" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M80 890 Q800 790 1520 890" fill="none" stroke="#122e47" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="125" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#6fa4c3" letter-spacing="3">BRAND SYSTEM / CAMPAIGN KIT</text><g transform="rotate(-7 600 450)" ><rect x="185" y="218" width="820" height="485" rx="22" fill="url(#paper)" stroke="#e0f2f6" filter="url(#shadow)"/><text x="230" y="279" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#164562" >FORM / 01</text><text x="230" y="364" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#102b42" >One system.</text><text x="230" y="426" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#102b42" >Every touchpoint.</text><rect x="232" y="500" width="150" height="92" rx="12" fill="#07182e" stroke="none" /><text x="232" y="628" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#315b72" >NAVY</text><rect x="406" y="500" width="150" height="92" rx="12" fill="#1658e5" stroke="none" /><text x="406" y="628" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#315b72" >BLUE</text><rect x="580" y="500" width="150" height="92" rx="12" fill="#24c8ed" stroke="none" /><text x="580" y="628" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#315b72" >CYAN</text><rect x="754" y="500" width="150" height="92" rx="12" fill="#b4eaf5" stroke="none" /><text x="754" y="628" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#315b72" >ICE</text></g><g transform="rotate(7 1140 390)" ><rect x="899" y="239" width="482" height="302" rx="21" fill="url(#panel)" stroke="#5185a0" filter="url(#shadow)"/><text x="934" y="290" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#d3f5ff" >F / CAMPAIGN</text><path d="M1035 505 C980 320 1265 278 1276 445 C1284 561 1080 470 1152 350" fill="none" stroke="url(#cyan)" stroke-width="37" stroke-linecap="round" stroke-linejoin="round" /><text x="936" y="502" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" fill="#fff" >Move forward.</text></g><g transform="rotate(-3 1100 680)" ><rect x="835" y="574" width="600" height="220" rx="18" fill="#0d2f4d" stroke="#2e6688" filter="url(#shadow)"/><text x="872" y="622" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#92cbe2" >F / SOCIAL</text><text x="872" y="680" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#f4fbff" >Built for momentum.</text><rect x="872" y="719" width="190" height="37" rx="8" fill="url(#cyan)" stroke="none" /><text x="890" y="745" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#08223a" >Explore the platform</text><circle cx="1290" cy="680" r="60" fill="none" stroke="#4cd8fa" stroke-width="3"/><circle cx="1303" cy="680" r="52" fill="none" stroke="#4cd8fa" stroke-width="3"/><circle cx="1316" cy="680" r="44" fill="none" stroke="#4cd8fa" stroke-width="3"/><circle cx="1329" cy="680" r="36" fill="none" stroke="#4cd8fa" stroke-width="3"/></g></svg>