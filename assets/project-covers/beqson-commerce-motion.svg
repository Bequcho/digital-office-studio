<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BEQSON Commerce Motion — interactive product showcase</title>
  <desc id="desc">A premium speaker in icy blue finishes, surrounded by light rings, against a deep navy studio background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06132a"/><stop offset=".56" stop-color="#092b48"/><stop offset="1" stop-color="#050d1e"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#1a92d7" stop-opacity=".55"/><stop offset=".5" stop-color="#106bb0" stop-opacity=".14"/><stop offset="1" stop-color="#106bb0" stop-opacity="0"/></radialGradient>
    <linearGradient id="body"><stop stop-color="#102e4a"/><stop offset=".19" stop-color="#376b91"/><stop offset=".4" stop-color="#9ce4ff"/><stop offset=".59" stop-color="#5b9cce"/><stop offset=".82" stop-color="#214464"/><stop offset="1" stop-color="#06172e"/></linearGradient>
    <linearGradient id="shine" x2=".9" y2="1"><stop stop-color="#a8f7ff" stop-opacity=".36"/><stop offset="1" stop-color="#58a7ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="light" x2="1" y2="0"><stop stop-color="#35adff" stop-opacity="0"/><stop offset=".55" stop-color="#67f1ff"/><stop offset="1" stop-color="#35adff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="68" height="68" patternUnits="userSpaceOnUse"><path d="M68 0H0V68" stroke="#7bcfff" stroke-opacity=".10" fill="none"/></pattern>
    <pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6H12" stroke="#04243d" stroke-opacity=".30"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1120" cy="490" r="610" fill="url(#halo)"/>
  <g fill="none" stroke="#78ccff">
    <ellipse cx="1110" cy="580" rx="490" ry="178" stroke-opacity=".22" transform="rotate(-18 1110 580)" stroke-width="2"/>
    <ellipse cx="1110" cy="580" rx="400" ry="141" stroke-opacity=".22" transform="rotate(-18 1110 580)" stroke-dasharray="8 16"/>
    <ellipse cx="1110" cy="580" rx="280" ry="105" stroke-opacity=".17" transform="rotate(-18 1110 580)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e9f8ff">
    <text x="100" y="135" font-size="31" letter-spacing="10" font-weight="bold">BEQSON.</text>
    <text x="100" y="202" font-size="21" letter-spacing="6" fill="#51d6ff">INTERACTIVE SHOWCASE / 03</text>
    <text x="100" y="467" font-size="96" font-weight="bold" letter-spacing="-5">COMMERCE</text>
    <text x="100" y="563" font-size="96" font-weight="bold" letter-spacing="-5">MOTION</text>
    <text x="105" y="626" font-size="25" fill="#95bfdd" letter-spacing="1.3">Explore. Customize. Add to cart.</text>
    <rect x="100" y="721" width="282" height="70" rx="13" fill="#117fc7" stroke="#85eaff" stroke-opacity=".75"/>
    <text x="141" y="765" font-size="23" font-weight="bold">360° PRODUCT UI</text>
    <text x="100" y="888" font-size="17" letter-spacing="4" fill="#73aacc">CONCEPT PROJECT  /  CSS · JAVASCRIPT</text>
  </g>
  <g transform="translate(1050 210)">
    <ellipse cx="100" cy="626" rx="276" ry="39" fill="#38adff" opacity=".4" filter="url(#blur)"/>
    <ellipse cx="100" cy="627" rx="265" ry="52" fill="#082b49" stroke="#4e9be1" stroke-opacity=".55" stroke-width="3"/>
    <ellipse cx="100" cy="616" rx="202" ry="18" fill="none" stroke="url(#light)" stroke-width="8"/>
    <g filter="url(#shadow)" opacity=".65"><rect x="-89" y="84" width="372" height="529" rx="177" fill="#010912"/></g>
    <rect x="-79" y="34" width="360" height="563" rx="153" fill="url(#body)"/>
    <rect x="-79" y="34" width="360" height="563" rx="153" fill="url(#weave)" opacity=".48"/>
    <ellipse cx="101" cy="40" rx="180" ry="47" fill="#0b243c" stroke="#79c9f2" stroke-width="6"/>
    <ellipse cx="101" cy="40" rx="155" ry="31" fill="#173958"/>
    <ellipse cx="101" cy="40" rx="138" ry="24" fill="none" stroke="#427998" stroke-width="2" stroke-dasharray="5 10"/>
    <path d="M-46 92C-10 74 21 77 50 81V560C4 575-23 548-46 523Z" fill="url(#shine)"/>
    <rect x="-65" y="550" width="331" height="11" rx="5" fill="url(#light)"/>
    <circle cx="101" cy="373" r="39" fill="#082a46" stroke="#8ae9ff" stroke-opacity=".8" stroke-width="3"/>
    <text x="101" y="386" text-anchor="middle" font-family="Arial" fill="#dbfaff" font-size="38" font-weight="bold">H</text>
    <text x="100" y="430" text-anchor="middle" font-family="Arial" letter-spacing="7" font-size="16" fill="#def8ff">HALO</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#b9e9ff">
    <rect x="1320" y="120" width="184" height="54" rx="27" fill="#0f3857" stroke="#61cbff" stroke-opacity=".6"/>
    <text x="1412" y="154" font-size="18" letter-spacing="2">DRAG TO ROTATE</text>
  </g>
</svg>
