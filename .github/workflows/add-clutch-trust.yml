name: Add Clutch trust signal
on:
  push:
    paths:
      - '.github/workflows/add-clutch-trust.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Clutch sameAs and homepage trust blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          clutch_url = 'https://clutch.co/profile/beqson-digital-studio'

          # Add Clutch to Organization.sameAs anywhere the shared BEQSON Organization schema appears.
          pattern = re.compile(r'"sameAs"\s*:\s*\[\s*"https://t\.me/digital_studio_beqson"\s*\]')
          replacement = '"sameAs":["https://t.me/digital_studio_beqson","' + clutch_url + '"]'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or 'crm' in p.parts: continue
              s = p.read_text(encoding='utf-8')
              updated = pattern.sub(replacement, s)
              if updated != s:
                  p.write_text(updated, encoding='utf-8')

          blocks = {
              'en/index.html': '''<section class="clutch-trust-strip" aria-label="Independent company profile"><div class="shell"><a class="clutch-trust-card" href="https://clutch.co/profile/beqson-digital-studio" target="_blank" rel="noopener noreferrer" aria-label="Find BEQSON Digital Studio on Clutch"><div class="clutch-trust-copy"><span class="clutch-trust-kicker">INDEPENDENT COMPANY PROFILE</span><strong>Find us on Clutch</strong><span>View our services, portfolio and company profile on Clutch.</span></div><span class="clutch-wordmark" aria-hidden="true">Clutch<span class="clutch-dot">•</span></span><span class="clutch-arrow" aria-hidden="true">↗</span></a></div></section>\n''',
              'ru/index.html': '''<section class="clutch-trust-strip" aria-label="Профиль компании на независимой платформе"><div class="shell"><a class="clutch-trust-card" href="https://clutch.co/profile/beqson-digital-studio" target="_blank" rel="noopener noreferrer" aria-label="Открыть профиль BEQSON Digital Studio на Clutch"><div class="clutch-trust-copy"><span class="clutch-trust-kicker">ПРОФИЛЬ НА НЕЗАВИСИМОЙ ПЛАТФОРМЕ</span><strong>BEQSON на Clutch</strong><span>Посмотрите наши услуги, портфолио и профиль студии на Clutch.</span></div><span class="clutch-wordmark" aria-hidden="true">Clutch<span class="clutch-dot">•</span></span><span class="clutch-arrow" aria-hidden="true">↗</span></a></div></section>\n''',
              'ka/index.html': '''<section class="clutch-trust-strip" aria-label="კომპანიის პროფილი დამოუკიდებელ პლატფორმაზე"><div class="shell"><a class="clutch-trust-card" href="https://clutch.co/profile/beqson-digital-studio" target="_blank" rel="noopener noreferrer" aria-label="BEQSON Digital Studio-ს პროფილის გახსნა Clutch-ზე"><div class="clutch-trust-copy"><span class="clutch-trust-kicker">დამოუკიდებელი კომპანიის პროფილი</span><strong>გვიპოვეთ Clutch-ზე</strong><span>იხილეთ ჩვენი სერვისები, პორტფოლიო და სტუდიის პროფილი Clutch-ზე.</span></div><span class="clutch-wordmark" aria-hidden="true">Clutch<span class="clutch-dot">•</span></span><span class="clutch-arrow" aria-hidden="true">↗</span></a></div></section>\n'''
          }

          marker = '<section class="contact-section section" id="contact">'
          for path, block in blocks.items():
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if 'clutch-trust-strip' not in s:
                  if marker not in s:
                      raise SystemExit(f'Contact marker not found in {path}')
                  s = s.replace(marker, block + marker, 1)
              s = s.replace('../styles.css?v=11-contact-solid', '../styles.css?v=12-clutch-trust')
              p.write_text(s, encoding='utf-8')

          css = Path('styles.css')
          s = css.read_text(encoding='utf-8')
          if '/* clutch-trust */' not in s:
              s += '''\n\n/* clutch-trust */\n.clutch-trust-strip{padding:18px 0 4px}\n.clutch-trust-card{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:22px;padding:20px 24px;border:1px solid rgba(75,208,255,.30);border-radius:20px;background:radial-gradient(circle at 88% 20%,rgba(53,200,255,.14),transparent 34%),linear-gradient(135deg,#071a31,#0a2d50);box-shadow:0 18px 55px rgba(0,0,0,.18);text-decoration:none!important;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}\n.clutch-trust-card:hover{transform:translateY(-2px);border-color:rgba(75,208,255,.62);box-shadow:0 22px 64px rgba(0,0,0,.24)}\n.clutch-trust-copy{display:flex;flex-direction:column;gap:3px;min-width:0}\n.clutch-trust-kicker{color:#4bd0ff;font-size:10px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase}\n.clutch-trust-copy strong{color:#fff;font-size:clamp(18px,2vw,22px);line-height:1.2}\n.clutch-trust-copy>span:last-child{color:#a9c6e2;font-size:14px;line-height:1.45}\n.clutch-wordmark{color:#fff;font-size:30px;font-weight:900;letter-spacing:-1.4px;white-space:nowrap}\n.clutch-dot{color:#ef3f2f}\n.clutch-arrow{display:grid;place-items:center;width:38px;height:38px;border:1px solid rgba(75,208,255,.38);border-radius:12px;color:#4bd0ff;font-size:20px;font-weight:900}\n@media(max-width:720px){.clutch-trust-card{grid-template-columns:1fr auto;gap:14px;padding:18px}.clutch-wordmark{font-size:25px}.clutch-arrow{display:none}.clutch-trust-copy>span:last-child{font-size:13px}}\n'''
              css.write_text(s, encoding='utf-8')
          PY
      - name: Commit Clutch trust signal
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' styles.css
          git commit -m 'seo: add Clutch profile trust signal'
          git push