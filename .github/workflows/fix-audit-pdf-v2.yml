name: Fix audit PDF export v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace blank HTML capture with direct canvas PDF rendering
        run: |
          # PDF v3 supersedes the old inline rendering patches.
          python scripts/install_audit_pdf_v3.py
      - name: Commit PDF fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix blank audit PDFs with canvas renderer"
          git push
