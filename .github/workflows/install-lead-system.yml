name: Install BEQSON Lead System

on:
  push:
    paths:
      - '.github/workflows/install-lead-system.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject lead system into HTML pages
        run: |
          # The maintained page generator owns lead-system includes and their scope.
          python tools/build.py
          python tools/test_build.py
      - name: Commit injected references
        run: |
          if git diff --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ru/index.html ka/index.html en/index.html ru/*/index.html ka/*/index.html en/*/index.html
          git commit -m "chore: bump BEQSON lead system to v2"
          git push
