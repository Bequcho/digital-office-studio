name: Upgrade hotels SEO pages fix

on:
  push:
    paths:
      - '.github/workflows/upgrade-hotels-seo-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct English source phrase
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/upgrade_hotels_seo.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("A place guests<br>want to experience.", "A place you will<br>want to experience.")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Upgrade multilingual hotel SEO pages
        run: python scripts/upgrade_hotels_seo.py
      - name: Commit generated pages
        run: |
          git checkout -- scripts/upgrade_hotels_seo.py
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/hotels/index.html ru/hotels/index.html ka/hotels/index.html
          git commit -m "seo: strengthen hotel landing pages in EN RU KA"
          git push
