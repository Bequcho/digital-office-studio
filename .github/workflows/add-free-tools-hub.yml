name: Connect Free Tools hub
on:
  push:
    paths:
      - '.github/workflows/add-free-tools-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tools navigation and sitemap entries
        run: |
          # Render approved components; do not inject another audit/navigation block.
          python tools/build.py
          python tools/test_build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru/index.html en/index.html ka/index.html sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: expose BEQSON Free Tools hub"
          git push