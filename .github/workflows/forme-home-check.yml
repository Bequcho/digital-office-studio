name: FORME HOME blueprint validation
on:
  push:
    paths:
      - "forme-home/**"
      - ".github/workflows/forme-home-check.yml"
  pull_request:
    paths:
      - "forme-home/**"
      - ".github/workflows/forme-home-check.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate WordPress Blueprint
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('forme-home/blueprint.json')
          data=json.loads(p.read_text())
          assert data['landingPage']=='/'
          assert any(s.get('step')=='installPlugin' and s.get('pluginData',{}).get('slug')=='woocommerce' for s in data['steps'])
          tree=next(s['filesTree'] for s in data['steps'] if s['step']=='writeFiles')
          assert 'style.css' in tree['files'] and 'functions.php' in tree['files']
          def write(d,root):
            for name,content in d.items():
              path=root/name
              if isinstance(content,dict):
                path.mkdir(exist_ok=True)
                write(content,path)
              else:
                path.write_text(content)
          root=pathlib.Path('/tmp/forme-wp-theme');root.mkdir(exist_ok=True)
          write(tree['files'],root)
          print('Blueprint valid; PHP theme extracted.')
          PY
      - name: Validate against official WordPress Playground schema
        run: |
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json, urllib.request
          from jsonschema import Draft7Validator
          blueprint=json.load(open('forme-home/blueprint.json'))
          with urllib.request.urlopen('https://playground.wordpress.net/blueprint-schema.json',timeout=30) as response:
            schema=json.load(response)
          validator=Draft7Validator(schema)
          errors=sorted(validator.iter_errors(blueprint),key=lambda e:str(e.path))
          if errors:
            for error in errors:
              print('ERROR:', list(error.path), error.message)
              for sub in error.context[:12]:
                print('  detail:', list(sub.path), sub.message[:300])
            raise SystemExit(1)
          print('Blueprint conforms to the official schema.')
          PY
      - name: Lint all PHP theme files
        run: find /tmp/forme-wp-theme -type f -name '*.php' -print -exec php -l {} \;
