name: Localize SEO audit pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-audit-pages.yml'
      - 'audit/index.html'
      - 'scripts/localize_audit.py'
      - 'scripts/fix_audit_i18n.py'
      - 'scripts/install_audit_pdf_v3.py'
      - 'tools/seo_hreflang.py'
      - 'tools/seo_schema.py'
      - 'tools/seo_social.py'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build localized audit pages
        run: |
          python scripts/localize_audit.py
          python scripts/fix_audit_i18n.py
          python scripts/install_audit_pdf_v3.py
      - name: Install validation dependency
        run: python -m pip install -r tools/requirements-workflows.txt
      - name: Validate localized audit pages
        run: |
          python tools/test_seo_metadata.py
          python tools/test_seo_schema.py
          python tools/test_seo_social.py
          python tools/test_sitemap.py
          python tools/test_workflows.py --localization-only
      - name: Commit localized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru/audit/index.html ka/audit/index.html en/audit/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Polish localized SEO audit pages"
          git push
