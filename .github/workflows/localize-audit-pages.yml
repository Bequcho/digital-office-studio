name: Localize SEO audit pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-audit-pages.yml'
      - 'scripts/localize_audit.py'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build localized audit pages
        run: python scripts/localize_audit.py
      - name: Commit localized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru/audit/index.html ka/audit/index.html en/audit/index.html ru/index.html ka/index.html en/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add localized SEO audit pages for RU EN KA"
          git push
