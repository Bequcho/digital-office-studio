              'contact':'გამარჯობა! BEQSON-ზე ჩავატარე {host}-ის SEO აუდიტი და მსურს გამოსწორებების განხილვა.',
              'email_subject':'BEQSON SEO აუდიტი — {host}',
              'pdf_audit':'საიტის SEO აუდიტი','pdf_date':'საიტის SEO აუდიტი','pdf_issues':'ძირითადი პრობლემები','pdf_plan':'პრიორიტეტული სამოქმედო გეგმა','pdf_checks':'ძირითადი შემოწმებების შედეგები',
              'pdf_fix':'გამოსასწორებელია','pdf_good':'✓ ძირითადი ტექნიკური შემოწმებების მიხედვით კრიტიკული პრობლემები ვერ მოიძებნა. ქვემოთ მოცემულია შემდეგი დონის SEO სამოქმედო გეგმა.',
              'pdf_score':'SEO SCORE','download_busy':'ვქმნით PDF-ს…',
              'status_ok':'HTTP პასუხი გამართულია.','status_bad':'HTTP პასუხი ყურადღებას საჭიროებს.',
              'yes':'სწორად არის კონფიგურირებული.','no':'არ არის ან ყურადღებას საჭიროებს.','length':'სიგრძე: {n} სიმბოლო.'
