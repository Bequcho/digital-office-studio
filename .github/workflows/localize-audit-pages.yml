          def add_hreflang(s, canonical):
            old = re.search(r'<link rel="canonical" href="[^"]+">', s)
            block = (
              f'<link rel="canonical" href="{canonical}">'
              '<link rel="alternate" hreflang="ru" href="https://beqson.com/ru/audit/">'
              '<link rel="alternate" hreflang="ka" href="https://beqson.com/ka/audit/">'
              '<link rel="alternate" hreflang="en" href="https://beqson.com/en/audit/">'
              '<link rel="alternate" hreflang="x-default" href="https://beqson.com/ka/audit/">'
            )
            return s[:old.start()] + block + s[old.end():] if old else s

          def replace_js_functions(s, lang):
            if lang == 'ru':
              return s
            lm = label_maps[lang]
            am = action_maps[lang]
            er = errors[lang]
            dy = dynamic[lang]
            labels_js = repr(lm).replace("'", '"')
            actions_js = repr(am).replace("'", '"')
            errors_js = repr({k:v for k,v in er.items() if k!='fallback'}).replace("'", '"')

            error_fn = f"function errorText(code){{const map={errors_js};return map[code]||{er['fallback']!r}}}"
            s = re.sub(r'function errorText\(code\)\{.*?\}\nfunction checkHtml', error_fn + '\nfunction checkHtml', s, count=1, flags=re.S)

            helper = f'''const AUDIT_LABELS={labels_js};\nfunction labelFor(c){{return AUDIT_LABELS[c.id]||c.label||c.id}}\nfunction detailFor(c){{const ok=Number(c.points)===Number(c.max);if(c.id==='status')return ok?{dy['status_ok']!r}:{dy['status_bad']!r};if(c.id==='title'||c.id==='description'){{const m=String(c.detail||'').match(/\\d+/);if(m)return {dy['length']!r}.replace('{{n}}',m[0])}}return ok?{dy['yes']!r}:{dy['no']!r}}}\nfunction checkHtml(c){{const cls=c.points===c.max?'ok':(c.points>0?'partial':'bad'),ico=cls==='ok'?'✓':(cls==='partial'?'!':'×');return `<div class="check ${{cls}}"><div class="ico">${{ico}}</div><div><strong>${{esc(labelFor(c))}}</strong><div class="detail">${{esc(detailFor(c))}}</div></div><div class="pts">${{c.points}}/${{c.max}}</div></div>`}}'''
            s = re.sub(r'function checkHtml\(c\)\{.*?\}\nfunction issues', helper + '\nfunction issues', s, count=1, flags=re.S)

            action_fn = f"function actionFor(c){{const actions={actions_js};return actions[c.id]||(''+labelFor(c))}}"
            s = re.sub(r'function actionFor\(c\)\{.*?\}\nfunction planItems', action_fn + '\nfunction planItems', s, count=1, flags=re.S)

            plan_fn = f"function planItems(d){{const bad=issues(d);if(bad.length)return bad.map(c=>({{title:labelFor(c),text:actionFor(c)}}));return[{{title:{dy['cw_title']!r},text:{dy['cw_text']!r}}},{{title:{dy['sem_title']!r},text:{dy['sem_text']!r}}},{{title:{dy['local_title']!r},text:{dy['local_text']!r}}}]}}"
            s = re.sub(r'function planItems\(d\)\{.*?\}\nfunction updateContactLinks', plan_fn + '\nfunction updateContactLinks', s, count=1, flags=re.S)

            contact_fn = f"function updateContactLinks(d){{const site=d?.final_url||d?.url||'',host=d?.host||site,msg={dy['contact']!r}.replace('{{host}}',host);$('ctaWhatsapp').href='https://wa.me/995551739333?text='+encodeURIComponent(msg);$('ctaTelegram').href='https://t.me/digital_studio_beqson';$('ctaEmail').href='mailto:digitalstudiobeqson@gmail.com?subject='+encodeURIComponent({dy['email_subject']!r}.replace('{{host}}',host))+'&body='+encodeURIComponent(msg+'\\n\\n'+site)}}"
            s = re.sub(r'function updateContactLinks\(d\)\{.*?\}\nform.addEventListener', contact_fn + '\nform.addEventListener', s, count=1, flags=re.S)

            # Dynamic UI strings.
            s = s.replace("$('previewTitle').textContent='Что стоит улучшить'", f"$('previewTitle').textContent={dy['preview_bad']!r}")
            s = s.replace("$('previewSub').textContent=`Найдено пунктов для внимания: ${bad.length}. Показываем самые важные — полный отчёт ниже.`", f"$('previewSub').textContent={dy['preview_bad_sub']!r}.replace('{{n}}',bad.length)")
            s = s.replace("$('gateText').textContent='Оставьте контакт — откроем полный список проверок и приоритетный план исправлений. Запрос автоматически сохранится в BEQSON CRM.'", f"$('gateText').textContent={dy['gate_bad']!r}")
            s = s.replace("$('previewTitle').textContent='Базовые проверки пройдены'", f"$('previewTitle').textContent={dy['preview_ok']!r}")
            s = s.replace("$('previewSub').textContent='Критичных проблем в экспресс-проверке не найдено. Полный отчёт и следующий уровень рекомендаций можно открыть ниже.'", f"$('previewSub').textContent={dy['preview_ok_sub']!r}")
            s = s.replace("$('gateText').textContent='Оставьте контакт — откроем полный отчёт и план более глубокого SEO-разбора: скорость, семантика, контент и локальное продвижение.'", f"$('gateText').textContent={dy['gate_ok']!r}")
            s = s.replace("ge.textContent='Сначала запустите аудит сайта.'", f"ge.textContent={dy['first_audit']!r}")
            s = s.replace("ge.textContent='Нужно подтвердить согласие на связь по результатам аудита.'", f"ge.textContent={dy['consent']!r}")
            s = s.replace("lb.textContent='Готовим отчёт…'", f"lb.textContent={dy['opening']!r}")
            s = s.replace("ge.textContent='Не удалось открыть полный отчёт. Проверьте данные и попробуйте ещё раз.'", f"ge.textContent={dy['lead_error']!r}")
            s = s.replace("lb.textContent='Открыть полный отчёт →'", "lb.textContent=document.getElementById('leadSubmit').dataset.label||document.getElementById('leadSubmit').textContent")
            s = s.replace("$('gateSuccess').innerHTML=`✓ Полный отчёт открыт. Запрос сохранён в BEQSON CRM.<br><span class=\"packagePill\">Рекомендованный пакет: ${esc(pkg)}</span>`", f"$('gateSuccess').innerHTML={dy['success']!r}+'<br><span class=\"packagePill\">'+{dy['package']!r}+': '+esc(pkg)+'</span>'")

            # Localize labels used inside generated PDF.
            s = s.replace('${esc(c.label)}', '${esc(labelFor(c))}')
            s = s.replace('${esc(c.detail)}', '${esc(detailFor(c))}')
            s = s.replace('<div class="pdfIssueTitle">${esc(labelFor(c))}</div>', '<div class="pdfIssueTitle">${esc(labelFor(c))}</div>')
            s = s.replace('>исправить</div>', f'>{dy["pdf_fix"]}</div>')
            s = s.replace('✓ По базовым техническим проверкам критичных проблем не выявлено. Ниже — план следующего уровня SEO-работ.', dy['pdf_good'])
            s = s.replace('SEO-аудит сайта', dy['pdf_audit'])
            s = s.replace('Ключевые проблемы', dy['pdf_issues'])
            s = s.replace('Приоритетный план работ', dy['pdf_plan'])
            s = s.replace('Результаты базовых проверок', dy['pdf_checks'])
            s = s.replace("new Date().toLocaleDateString('ru-RU'", "new Date().toLocaleDateString('en-GB'" if lang=='en' else "new Date().toLocaleDateString('ka-GE'")
            s = s.replace("b.innerHTML='<span class=\"pdfIcon\">◌</span> Формируем PDF…'", f"b.innerHTML='<span class=\"pdfIcon\">◌</span> {dy['download_busy']}'")
            return s

          for lang, cfg in pages.items():
            s = base
            s = re.sub(r'<html lang="[^"]+">', f'<html lang="{cfg["html_lang"]}">', s, count=1)
            s = add_hreflang(s, cfg['canonical'])
            s = re.sub(r'<meta property="og:url" content="[^"]+">', f'<meta property="og:url" content="{cfg["canonical"]}">', s, count=1)
            s = s.replace('href="/ru/" class="brand"', f'href="{cfg["home"]}" class="brand"', 1)
            s = s.replace('class="back" href="/ru/"', f'class="back" href="{cfg["home"]}"', 1)
            for old, new in cfg['repl'].items():
              s = s.replace(old, new)
            if lang != 'ru':
              # Restore localized button text after async operations.
              button_label = 'Open full report →' if lang == 'en' else 'სრული ანგარიშის გახსნა →'
              s = s.replace('id="leadSubmit" type="submit">' + button_label, 'id="leadSubmit" data-label="' + button_label + '" type="submit">' + button_label)
              s = replace_js_functions(s, lang)
            cfg['path'].parent.mkdir(parents=True, exist_ok=True)
            cfg['path'].write_text(s, encoding='utf-8')

          # Make homepage audit links language-specific.
          for lang in ('ru','ka','en'):
            p = repo / f'{lang}/index.html'
            s = p.read_text(encoding='utf-8')
            s = s.replace('href="/audit/"', f'href="/{lang}/audit/"')
            p.write_text(s, encoding='utf-8')
          PY
      - name: Commit multilingual audit pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru/audit/index.html ka/audit/index.html en/audit/index.html ru/index.html ka/index.html en/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add localized SEO audit pages for RU EN KA"
          git push
