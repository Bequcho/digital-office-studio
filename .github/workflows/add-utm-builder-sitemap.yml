name: Add UTM Builder to sitemap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add localized UTM Builder URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          s=p.read_text(encoding='utf-8')
          if 'https://beqson.com/ru/tools/utm-builder/' not in s:
              block='''  <url><loc>https://beqson.com/ru/tools/utm-builder/</loc><xhtml:link rel="alternate" hreflang="ru" href="https://beqson.com/ru/tools/utm-builder/" /><xhtml:link rel="alternate" hreflang="ka" href="https://beqson.com/ka/tools/utm-builder/" /><xhtml:link rel="alternate" hreflang="en" href="https://beqson.com/en/tools/utm-builder/" /><xhtml:link rel="alternate" hreflang="x-default" href="https://beqson.com/en/tools/utm-builder/" /></url>\n  <url><loc>https://beqson.com/ka/tools/utm-builder/</loc><xhtml:link rel="alternate" hreflang="ru" href="https://beqson.com/ru/tools/utm-builder/" /><xhtml:link rel="alternate" hreflang="ka" href="https://beqson.com/ka/tools/utm-builder/" /><xhtml:link rel="alternate" hreflang="en" href="https://beqson.com/en/tools/utm-builder/" /><xhtml:link rel="alternate" hreflang="x-default" href="https://beqson.com/en/tools/utm-builder/" /></url>\n  <url><loc>https://beqson.com/en/tools/utm-builder/</loc><xhtml:link rel="alternate" hreflang="ru" href="https://beqson.com/ru/tools/utm-builder/" /><xhtml:link rel="alternate" hreflang="ka" href="https://beqson.com/ka/tools/utm-builder/" /><xhtml:link rel="alternate" hreflang="en" href="https://beqson.com/en/tools/utm-builder/" /><xhtml:link rel="alternate" hreflang="x-default" href="https://beqson.com/en/tools/utm-builder/" /></url>\n'''
              s=s.replace('</urlset>', block+'</urlset>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit sitemap
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "seo: add UTM Builder to sitemap"
          git push
