name: Validate workflow and build regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r tools/requirements-workflows.txt
      - name: Validate workflows without publishing
        run: python tools/test_workflows.py
      - name: Validate IndexNow offline (no network submissions)
        run: python tools/test_indexnow.py
      - name: Validate build and SEO Steps 1–8
        run: python tools/test_build.py
      - name: Check whitespace
        run: git diff --check
