name: Upgrade core structured data v1

on:
  push:
    paths:
      - 'schema-upgrade-trigger-v1.txt'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strengthen structured data across BEQSON
        run: |
          python3 tools/seo_schema.py
          python3 tools/test_seo_schema.py

      - name: Commit structured data upgrade
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru ka en index.html
          git commit -m "seo: strengthen sitewide Organization WebSite Service schema"
          git push
