name: IndexNow manual sitemap validation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate production URLs only. Uncheck only after a successful Pages deployment and dry run.'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sitemap and optionally submit
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          INDEXNOW_KEY: 9a97aa27a069ea0350203fe532357c06
        run: python tools/indexnow.py --dry-run "$DRY_RUN"
