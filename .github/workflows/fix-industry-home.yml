name: Fix industry homepage cover
on:
  push:
    paths:
      - '.github/workflows/fix-industry-home.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace industry mosaic with dedicated SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('assets/projects.css')
          css = css_path.read_text(encoding='utf-8')
          new_rule = ".home-project-card:nth-child(3):before{background-image:url('/assets/project-covers/industry.svg');background-size:cover;background-position:center}"

          patterns = [
              r'html\[lang="en"\]\s+\.home-project-card:nth-child\(3\):before\{[^}]*\}',
              r'html\[lang="ru"\]\s+\.home-project-card:nth-child\(3\):before\{[^}]*\}',
              r'html\[lang="ka"\]\s+\.home-project-card:nth-child\(3\):before\{[^}]*\}',
          ]

          css, count = re.subn(patterns[0], new_rule, css, count=1)
          if count != 1:
              raise SystemExit('English industry mosaic rule not found')
          for pattern in patterns[1:]:
              css, count = re.subn(pattern, '', css, count=1)
              if count != 1:
                  raise SystemExit('Industry mosaic rule not found')
          css_path.write_text(css, encoding='utf-8')

          for rel in ['en/index.html', 'ru/index.html', 'ka/index.html']:
              p = Path(rel)
              html = p.read_text(encoding='utf-8')
              html = html.replace('projects.css?v=1', 'projects.css?v=6-industry-cover')
              p.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/projects.css en/index.html ru/index.html ka/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'portfolio: replace industry mosaic with dedicated cover'
          git push
