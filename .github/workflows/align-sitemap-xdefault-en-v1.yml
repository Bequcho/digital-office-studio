name: Align sitemap x-default to EN v1

on:
  push:
    paths:
      - 'sitemap-xdefault-trigger-v1.txt'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align x-default hreflang in sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('sitemap.xml')
          text = p.read_text(encoding='utf-8')
          new = re.sub(
              r'(hreflang="x-default" href="https://beqson\.com/)ka(/[^" ]*|/)(")',
              lambda m: m.group(1) + 'en' + m.group(2) + m.group(3),
              text
          )
          if new != text:
              p.write_text(new, encoding='utf-8')
              print('Updated sitemap x-default links to EN.')
          else:
              print('No sitemap x-default changes needed.')
          PY
          if git diff --quiet -- sitemap.xml; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "seo: align sitemap x-default hreflang to EN"
          git push
