name: Install generated project covers
on:
  push:
    paths:
      - '.github/workflows/install-project-covers.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cover sprite
        run: |
          cat .github/portfolio-image-chunks/part_00.txt .github/portfolio-image-chunks/part_01.txt .github/portfolio-image-chunks/part_02.txt .github/portfolio-image-chunks/part_03.txt .github/portfolio-image-chunks/part_04.txt .github/portfolio-image-chunks/part_05.txt | base64 -d > assets/project-covers-sprite.webp
          test "$(head -c 4 assets/project-covers-sprite.webp)" = "RIFF"
      - name: Update project cards
        run: python scripts/install-project-covers.py
      - name: Commit project covers
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain assets/project-covers-sprite.webp)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/project-covers-sprite.webp assets/projects.css en/projects/index.html ru/projects/index.html ka/projects/index.html
          git commit -m 'portfolio: add generated covers to project cards'
          git push
