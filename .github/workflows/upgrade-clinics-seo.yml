name: Upgrade clinics SEO pages

on:
  push:
    paths:
      - 'scripts/upgrade_clinics_seo.py'
      - '.github/workflows/upgrade-clinics-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade clinic pages
        run: python tools/build.py
      - name: Validate generated site
        run: python tools/test_build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/clinics/index.html ru/clinics/index.html ka/clinics/index.html
          git diff --cached --quiet || git commit -m "seo: strengthen clinic landing pages in EN RU KA"
          git push
