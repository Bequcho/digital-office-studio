name: Add audit entry to homepages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add audit links and promo blocks
        run: |
          # Render approved components; do not inject another audit/navigation block.
          python tools/build.py
          python tools/test_build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru/index.html ka/index.html en/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add free SEO audit entry points to homepages"
          git push
