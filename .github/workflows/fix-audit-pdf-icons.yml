name: Fix audit PDF and contact icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-audit-pdf-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch audit page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('audit/index.html')
          s = path.read_text(encoding='utf-8')

          # Compact icon-only neon buttons on every breakpoint.
          s = re.sub(r'\.channelBtn\{[^}]*\}', '.channelBtn{width:68px;height:68px;min-width:68px;min-height:68px;padding:0;border-radius:19px;display:grid;place-items:center;color:white;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;border:1px solid transparent}', s, count=1)
          s = re.sub(r'\.channelIcon\{[^}]*\}', '.channelIcon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}', s, count=1)
          s = re.sub(r'\.channelArrow\{[^}]*\}', '.channelArrow{display:none}', s, count=1)
          if '.contactSvg{' not in s:
              s = s.replace('.channelBtn.whatsapp{', '.contactSvg{width:27px;height:27px;fill:currentColor;display:block}.channelBtn.whatsapp{', 1)

          def icon_link(button_id, icon_id):
              pattern = rf'(<a id="{button_id}"[^>]*>).*?</a>'
              repl = rf'\1<span class="channelIcon"><svg class="contactSvg" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/icons.svg?v=11-contact-solid#{icon_id}"></use></svg></span></a>'
              return pattern, repl

          for bid, iid in [('ctaWhatsapp','whatsapp'),('ctaTelegram','telegram'),('ctaEmail','mail')]:
              pat, repl = icon_link(bid, iid)
              s = re.sub(pat, repl, s, count=1, flags=re.S)

          s = s.replace('.channelBtn{flex:1;min-width:145px}', '.channelBtn{flex:0 0 68px;min-width:68px}', 1)
          s = s.replace('.ctaChannels{flex-direction:column}.channelBtn{width:100%}', '.ctaChannels{flex-direction:row;flex-wrap:wrap}.channelBtn{width:68px}', 1)

          # html2canvas/html2pdf may capture an empty canvas when the source sits far off-screen.
          if '.pdfReport.pdfRendering{' not in s:
              s = s.replace('</style>', '.pdfReport.pdfRendering{position:fixed!important;left:0!important;top:0!important;z-index:2147483646!important;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:none!important;background:#fff!important}\n</style>', 1)

          old = "buildPdfReport();const b=$('downloadPdf'),old=b.innerHTML;"
          new = "buildPdfReport();const report=$('pdfReport');report.classList.add('pdfRendering');if(document.fonts&&document.fonts.ready)await document.fonts.ready;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const b=$('downloadPdf'),old=b.innerHTML;"
          if old in s:
              s = s.replace(old, new, 1)
          elif "buildPdfReport();const report=$('pdfReport');report.classList.add('pdfRendering');await new Promise" in s:
              s = s.replace("buildPdfReport();const report=$('pdfReport');report.classList.add('pdfRendering');await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const b=$('downloadPdf'),old=b.innerHTML;", new, 1)

          s = s.replace(".from($('pdfReport')).save()", ".from(report).save()", 1)

          old_opts = "html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0,windowWidth:794,windowHeight:1123}"
          new_opts = "html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0,windowWidth:794,windowHeight:1123,onclone:(doc)=>{const el=doc.getElementById('pdfReport');if(el){el.style.position='static';el.style.left='0';el.style.top='0';el.style.display='block';el.style.visibility='visible';el.style.opacity='1';el.style.transform='none';}}}"
          s = s.replace(old_opts, new_opts, 1)
          s = s.replace("html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false}", new_opts, 1)
          s = s.replace("finally{b.disabled=false;b.innerHTML=old}", "finally{report.classList.remove('pdfRendering');b.disabled=false;b.innerHTML=old}", 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Harden audit PDF rendering and mobile contact icons"
          git push
