              schema=generate_schema(lang, 'projects', f'https://beqson.com/{lang}/projects/', SEO_METADATA[lang+'/projects/']['title'], SEO_METADATA[lang+'/projects/']['description'], 'CollectionPage')
              flaglinks=f'''<a href="/en/projects/" hreflang="en">EN</a><a href="/ka/projects/" hreflang="ka">KA</a><a href="/ru/projects/" hreflang="ru">RU</a>'''
              return f'''<!doctype html><html lang="{lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(SEO_METADATA[lang+'/projects/']['title'])}</title><meta name="description" content="{html.escape(SEO_METADATA[lang+'/projects/']['description'],quote=True)}"><meta name="theme-color" content="#06172f"><link rel="canonical" href="https://beqson.com/{lang}/projects/">{render_hreflang('projects')}<meta property="og:type" content="website"><meta property="og:site_name" content="BEQSON Digital Studio"><meta property="og:title" content="{html.escape(loc['title'],quote=True)}"><meta property="og:description" content="{html.escape(loc['meta'],quote=True)}"><meta property="og:url" content="https://beqson.com/{lang}/projects/"><meta property="og:image" content="https://beqson.com/assets/og-cover.png"><link rel="icon" href="/assets/favicon-v3.png?v=3" type="image/png"><link rel="stylesheet" href="/styles.css?v=12-clutch-trust"><link rel="stylesheet" href="/assets/projects.css?v=4-vector-covers"><script type="application/ld+json">{json.dumps(schema,ensure_ascii=False,separators=(',',':'))}</script><script src="/assets/projects.js?v=1" defer></script></head><body class="projects-page" id="top"><header class="site-header"><div class="shell header-inner"><a class="brand" href="/{lang}/"><img src="/assets/beqson-mark-v3.png" width="42" height="42" alt=""><span><b>BEQSON</b><small>DIGITAL STUDIO</small></span></a><nav class="main-nav" aria-label="Navigation"><a href="/{lang}/">{loc['home']}</a><a href="/{lang}/projects/" aria-current="page">{loc['projects']}</a><a href="/{lang}/tools/">{loc['tools']}</a><a href="/{lang}/#pricing">{loc['pricing']}</a></nav><div class="header-tools"><div class="languages">{flaglinks}</div><a class="button primary" href="/{lang}/#contact">{loc['contact']}</a></div></div></header><main><section class="projects-hero"><div class="projects-shell"><p class="eyebrow">{loc['eyebrow']}</p><h1>{loc['h1']}</h1><p class="lead">{loc['lead']}</p><div class="portfolio-note">{loc['truth']}</div></div></section><section><div class="projects-shell"><div class="project-filters" aria-label="Project filters">{filters}</div><div class="projects-grid">{cards}</div></div></section><section class="projects-cta"><div class="projects-shell"><div class="projects-cta-card"><h2>{loc['cta']}</h2><p>{loc['ctabody']}</p><a class="button primary" href="/{lang}/#contact">{loc['ctabtn']}</a></div></div></section></main><footer class="site-footer"><div class="shell footer-inner"><a class="footer-brand" href="/{lang}/">BEQSON<span>© 2026 Digital Studio</span></a><p>Web · SEO · AI · Branding · Design</p><a class="text-link" href="#top">↑</a></div></footer></body></html>'''

          for lang in ('en','ru','ka'):
              d=Path(lang)/'projects'; d.mkdir(parents=True,exist_ok=True); (d/'index.html').write_text(page(lang),encoding='utf-8')
          Path('projects').mkdir(exist_ok=True)
          Path('projects/index.html').write_text('''<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>BEQSON Projects</title><script>const l=(navigator.language||'en').toLowerCase();location.replace(l.startsWith('ka')?'/ka/projects/':l.startsWith('ru')?'/ru/projects/':'/en/projects/');</script></head><body><a href="/en/projects/">BEQSON Projects</a></body></html>''',encoding='utf-8')

          def teaser(lang):
              loc=L[lang]
              pick=['beqson','geo','industry','brandkit','report','aivisual']
              labels={'beqson':loc['badges']['studio'],'geo':loc['badges']['framework'],'industry':loc['badges']['concept'],'brandkit':loc['badges']['concept'],'report':loc['badges']['concept'],'aivisual':loc['badges']['concept']}
              cards=[]
              for key in pick:
                  title,desc,_=loc['cards'][key]
                  cards.append(f'<a class="home-project-card" href="/{lang}/projects/#{key}"><span>{labels[key]}</span><strong>{html.escape(title)}</strong><small>{html.escape(desc[:135])}…</small></a>')
              return f'''<section class="home-projects-strip"><div class="shell"><div class="home-projects-head"><div><p class="eyebrow">PORTFOLIO</p><h2>{loc['selected']}</h2></div><p>{loc['selectedlead']}</p></div><div class="home-projects-grid">{''.join(cards)}</div><a class="home-projects-more" href="/{lang}/projects/">{loc['allprojects']} →</a></div></section>'''

          for lang in ('en','ru','ka'):
              p=Path(lang)/'index.html'; s=p.read_text(encoding='utf-8')
              if '/assets/projects.css' not in s:
                  s=s.replace('</head>','<link rel="stylesheet" href="/assets/projects.css?v=4-vector-covers"></head>')
              # Make the main Projects navigation lead to the full portfolio.
              if lang=='en': s=s.replace('<a href="#case">Our Projects</a>','<a href="/en/projects/">Our Projects</a>')
              elif lang=='ru': s=s.replace('<a href="#case">Наши проекты</a>','<a href="/ru/projects/">Наши проекты</a>')
              else:
                  s=s.replace('<a href="#case">ჩვენი პროექტები</a>','<a href="/ka/projects/">ჩვენი პროექტები</a>')
                  s=s.replace('<a href="#case">პროექტები</a>','<a href="/ka/projects/">პროექტები</a>')
              if 'class="home-projects-strip"' not in s:
                  marker='<section class="section case-section" id="case">'
                  i=s.find(marker)
                  if i!=-1:
                      j=s.find('</section>',i)
                      if j!=-1:
                          j+=len('</section>'); s=s[:j]+'\n'+teaser(lang)+s[j:]
              p.write_text(s,encoding='utf-8')

          from tools.build_sitemap import build_sitemap
          build_sitemap()
          PY
      - name: Commit portfolio
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/projects.css assets/projects.js en/projects ru/projects ka/projects projects en/index.html ru/index.html ka/index.html sitemap.xml
          git commit -m 'portfolio: add multilingual projects showcase'
          git push
